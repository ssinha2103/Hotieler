[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hotieler"
version = "0.1.0"
description = "Backend-only hotel booking service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115.12,<1",
  "pydantic>=2.11.4,<3",
  "uvicorn>=0.34.2,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3.5,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hotieler"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hotieler"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
